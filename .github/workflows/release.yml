# Builds the Windows installer and creates a draft GitHub release.
# Run it by hand: Actions → Release → Run workflow, entering the version (e.g. 1.0.1)
# after bumping the version, updating CHANGELOG.md and pushing to main.
# Review the draft on GitHub, then publish it.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must match tauri.conf.json), e.g. 1.0.1
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($v -ne '${{ inputs.version }}') { throw "tauri.conf.json has $v, not ${{ inputs.version }}. Run scripts/bump-version.ps1 first." }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v${{ inputs.version }}
          releaseName: HiFi Player v${{ inputs.version }}
          releaseBody: See CHANGELOG.md for what's new in this version.
          releaseDraft: true
          prerelease: false
