[package]
name = "hifiplayer"
version = "1.1.0"
edition = "2024"
description = "Bit-perfect Windows music player with WASAPI Exclusive, ASIO and native DSD"

[workspace]
members = [".", "app/src-tauri"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
flacenc = "0.5.1"
futures-util = "0.3.34"
librespot-connect = "0.8"
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-oauth = "0.8"
librespot-playback = { version = "0.8", default-features = false }
lofty = "0.25.4"
md5 = "0.8.1"
rayon = "1.12.0"
rtrb = "0.4.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
ureq = { version = "3.5.0", features = ["json"] }
wasapi = "0.26.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
