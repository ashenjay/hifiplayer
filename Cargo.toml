[package]
name = "hifiplayer"
version = "0.1.0"
edition = "2024"
description = "Bit-perfect Windows music player with WASAPI Exclusive, ASIO and native DSD"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
rtrb = "0.4.0"
symphonia = { version = "0.6.1", features = ["all"] }
wasapi = "0.26.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
