[package]
name = "hifiplayer-app"
version = "1.2.1"
description = "HiFi Player desktop app"
edition = "2024"

[lib]
name = "hifiplayer_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0"
hifiplayer = { path = "../.." }
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
souvlaki = "0.8.3"
tauri = { version = "2.12.5", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5.4"
tiny_http = "0.12.0"
md5 = "0.8"
socket2 = { version = "0.6", features = ["all"] }
ureq = "3.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
